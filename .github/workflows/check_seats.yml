name: Check FCC seat availability (continuous)

on:
  schedule:
    - cron: "0 */6 * * *"   # restart every 6 hours, before GitHub's ~6hr job limit
  workflow_dispatch: {}

concurrency:
  group: check-seats
  cancel-in-progress: true   # a fresh restart replaces the old one seamlessly

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # just under 6 hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: "Loop: check every ~20 seconds"
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          TERM_CODE: "2026FA"
          WATCHLIST: ""
        run: |
          git config user.name "seat-bot"
          git config user.email "seat-bot@users.noreply.github.com"

          END=$((SECONDS + 21000))   # ~5h50m of checking, leaving buffer before restart
          i=0

          while [ $SECONDS -lt $END ]; do
            python check_seats.py || echo "Check failed, will retry next loop"
            i=$((i+1))

            # Push state to GitHub every ~90 checks (~30 min) instead of every single check
            if [ $((i % 90)) -eq 0 ]; then
              git add course_data/latest_seats.json
              git diff --staged --quiet || git commit -m "Update seat state [skip ci]"
              git pull --rebase origin main || true
              git push || true
            fi

            sleep 20
          done

          # Final save before this job ends / gets replaced
          git add course_data/latest_seats.json
          git diff --staged --quiet || git commit -m "Update seat state [skip ci]"
          git pull --rebase origin main || true
          git push || true

name: Check FCC seat availability

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay a bit under load)
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

concurrency:
  group: check-seats
  cancel-in-progress: false   # let a running check finish instead of overlapping

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run seat check
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          TERM_CODE: "2026FA"
          WATCHLIST: ""   # e.g. "COMP 111,COMP 206" — leave blank to watch everything
        run: python check_seats.py

      - name: Commit updated seat state
        run: |
          git config user.name "seat-bot"
          git config user.email "seat-bot@users.noreply.github.com"
          git add course_data/latest_seats.json
          git diff --staged --quiet || git commit -m "Update seat state [skip ci]"
          git pull --rebase origin main
          git push
